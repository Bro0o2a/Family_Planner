# 🧪 Runs the automatic checks on every pull request (and on main).
# A red ❌ on the pull request = something is broken: don't merge until it's green ✅.
name: Tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Syntax check (node --check on every js file)
        run: for f in ../js/*.js ../sw.js; do node --check "$f" || exit 1; done
      - name: Code check (names missing or used twice)
        run: npm run check
      - name: Screen test (every screen + pretend AI check)
        run: npm run smoke
